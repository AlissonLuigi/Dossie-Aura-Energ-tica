<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dossiê de Sincronia Bio-Energética</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#D4AF37;--gold-l:#F0D060;--gold-d:#8A7020;
  --pur:oklch(0.42 0.19 290);--pur-l:oklch(0.58 0.22 290);
  --rose:oklch(0.55 0.2 350);
  --bg:#050505;--text:rgba(255,255,255,0.88);--dim:rgba(255,255,255,0.4);
  --border:rgba(212,175,55,0.18);
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;cursor:none;}
@media(hover:none){body{cursor:auto;} .cursor-el{display:none;}}

/* ── AURORA ── */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.aurora-blob{position:absolute;border-radius:50%;filter:blur(90px);animation:auroraFloat var(--dur,20s) ease-in-out infinite alternate;}
.aurora-blob:nth-child(1){width:65vw;height:65vw;top:-15%;left:-20%;background:oklch(0.16 0.14 290/0.55);--dur:24s;}
.aurora-blob:nth-child(2){width:55vw;height:55vw;bottom:-20%;right:-15%;background:oklch(0.13 0.1 320/0.45);--dur:30s;animation-direction:alternate-reverse;}
.aurora-blob:nth-child(3){width:45vw;height:45vw;top:35%;left:25%;background:oklch(0.11 0.08 75/0.2);--dur:19s;}
.aurora-blob:nth-child(4){width:30vw;height:30vw;top:10%;right:10%;background:oklch(0.14 0.1 30/0.15);--dur:15s;animation-direction:alternate-reverse;}
@keyframes auroraFloat{
  0%{transform:translate(0,0) scale(1);}
  33%{transform:translate(3%,5%) scale(1.08);}
  66%{transform:translate(-4%,2%) scale(0.95);}
  100%{transform:translate(2%,-4%) scale(1.05);}
}

#particles-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* ── CURSOR ── */
.cursor-el{pointer-events:none;z-index:9999;position:fixed;}
#cursor-glow{
  width:32px;height:32px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,0.6) 0%,rgba(212,175,55,0.06) 55%,transparent 70%);
  transform:translate(-50%,-50%);
  transition:width 0.18s,height 0.18s;
  mix-blend-mode:screen;
}
#cursor-dot{
  width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,0.95);
  transform:translate(-50%,-50%);
  box-shadow:0 0 6px rgba(212,175,55,0.9);
  z-index:10000;
}

/* ── APP ── */
#app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;}

/* ── TRANSITIONS ── */
.fade-in{animation:fadeUp 0.85s cubic-bezier(0.16,1,0.3,1) both;}
.fade-out{animation:fadeOut 0.38s ease-in both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(36px) scale(0.97);}to{opacity:1;transform:none;}}
@keyframes fadeOut{from{opacity:1;transform:none;}to{opacity:0;transform:translateY(-20px);}}

/* ── HERO ── */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 80px;text-align:center;max-width:800px;margin:0 auto;position:relative;}
.hero-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(60px);animation:orbFloat var(--od,12s) ease-in-out infinite alternate;}
@keyframes orbFloat{0%{transform:translate(0,0);}100%{transform:translate(var(--ox,20px),var(--oy,30px));}}
.eyebrow{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);opacity:0.65;margin-bottom:36px;animation:fadeUp 1s 0.2s both;}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2.3rem,6.5vw,4.8rem);font-weight:300;line-height:1.08;color:#fff;margin-bottom:28px;text-wrap:pretty;animation:fadeUp 1s 0.35s both;}
.hero-title em{font-style:italic;background:linear-gradient(135deg,var(--gold-l) 0%,var(--gold) 45%,#c9960a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-rule{width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 32px;animation:fadeUp 1s 0.5s both;}
.hero-sub{font-size:clamp(0.95rem,2.2vw,1.12rem);font-weight:300;color:var(--dim);line-height:1.75;max-width:520px;margin-bottom:52px;animation:fadeUp 1s 0.6s both;}
.hero-sub strong{color:rgba(255,255,255,0.72);font-weight:400;}
.hero-cta-wrap{animation:fadeUp 1s 0.75s both;}
.hero-social{margin-top:48px;display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap;animation:fadeUp 1s 0.95s both;}
.hero-stat{display:flex;flex-direction:column;align-items:center;gap:4px;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:500;color:rgba(255,255,255,0.6);}
.stat-lbl{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.22);}
.stat-sep{width:1px;height:32px;background:rgba(255,255,255,0.08);}

/* ── SHIMMER CTA ── */
.btn-cta{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#c9a227,#D4AF37,#eacc55,#D4AF37,#b8870c);
  background-size:300% 100%;
  border:none;border-radius:3px;color:#050505;
  font-family:'Inter',sans-serif;font-size:13px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;
  padding:20px 52px;cursor:none;
  animation:shimmerBg 4s linear infinite,breatheCTA 2.8s ease-in-out infinite;
  transition:transform 0.2s,box-shadow 0.2s;
}
.btn-cta:hover{transform:scale(1.035);}
.btn-cta::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,0.32) 50%,transparent 70%);background-size:200% 100%;animation:shimmerPass 2.2s ease-in-out infinite;}
@keyframes shimmerBg{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
@keyframes shimmerPass{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes breatheCTA{0%,100%{box-shadow:0 0 24px rgba(212,175,55,0.22),0 4px 24px rgba(0,0,0,0.4);}50%{box-shadow:0 0 55px rgba(212,175,55,0.55),0 0 100px rgba(212,175,55,0.12),0 4px 24px rgba(0,0,0,0.4);}}

/* ── PROGRESS ── */
.prog-wrap{width:100%;max-width:520px;height:1px;background:rgba(255,255,255,0.05);margin-bottom:56px;position:relative;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--pur-l),var(--gold));transition:width 0.75s cubic-bezier(0.16,1,0.3,1);box-shadow:0 0 12px rgba(212,175,55,0.7);}
.prog-dot{position:absolute;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold),0 0 20px rgba(212,175,55,0.5);transition:left 0.75s cubic-bezier(0.16,1,0.3,1);margin-left:-3.5px;}

/* ── QUIZ ── */
.quiz-wrap{width:100%;max-width:640px;margin:0 auto;padding:52px 24px 110px;display:flex;flex-direction:column;align-items:center;}
.q-step{font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);opacity:0.55;margin-bottom:40px;}
.q-text{font-family:'Cormorant Garamond',serif;font-size:clamp(1.5rem,4.2vw,2.05rem);font-weight:400;text-align:center;line-height:1.32;margin-bottom:48px;color:#fff;min-height:90px;}
.q-cursor{display:inline-block;width:2px;height:0.9em;background:var(--gold);animation:blink 1s step-end infinite;vertical-align:text-bottom;margin-left:2px;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

.q-options{width:100%;display:flex;flex-direction:column;gap:10px;}
.q-opt{
  position:relative;overflow:hidden;
  background:rgba(255,255,255,0.025);
  border:1px solid rgba(255,255,255,0.065);
  border-radius:10px;padding:20px 52px 20px 22px;
  cursor:none;font-size:0.92rem;color:rgba(255,255,255,0.68);
  text-align:left;line-height:1.55;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  transition:border-color 0.3s,background 0.3s,transform 0.22s,color 0.25s;
}
.q-opt:hover{background:rgba(255,255,255,0.055);border-color:rgba(212,175,55,0.22);transform:translateX(5px);}
.q-opt.chosen{border-color:var(--gold);background:rgba(212,175,55,0.065);color:#fff;transform:translateX(5px);}
.q-opt.chosen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 15% 50%,var(--aura,rgba(212,175,55,0.2)) 0%,transparent 60%);animation:auraIn 0.55s ease-out forwards;}
.q-opt-shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,0.06) 50%,transparent 62%);transform:translateX(-100%);transition:transform 0.55s ease;}
.q-opt.chosen .q-opt-shine{transform:translateX(220%);}
@keyframes auraIn{from{opacity:0;transform:scale(0.5);}to{opacity:1;transform:scale(1);}}
.q-orb{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--aura,var(--gold));box-shadow:0 0 10px var(--aura,var(--gold)),0 0 22px var(--aura,var(--gold));animation:orbPop 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards;}
@keyframes orbPop{from{opacity:0;transform:translateY(-50%) scale(0);}to{opacity:1;transform:translateY(-50%) scale(1);}}

.btn-next{
  margin-top:36px;background:transparent;border:1px solid rgba(212,175,55,0.35);
  border-radius:3px;color:rgba(212,175,55,0.65);
  font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;
  padding:16px 44px;cursor:none;
  transition:all 0.28s;position:relative;overflow:hidden;
}
.btn-next:not(:disabled):hover{background:var(--gold);color:#050505;border-color:var(--gold);box-shadow:0 0 40px rgba(212,175,55,0.35);}
.btn-next:disabled{opacity:0.18;cursor:not-allowed;}

/* ── DEEP SCAN ── */
.scan-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
.scan-geo{position:relative;width:280px;height:280px;margin-bottom:52px;flex-shrink:0;}
.scan-ring{position:absolute;inset:0;border-radius:50%;border:1px solid transparent;}
.scan-ring:nth-child(1){border-color:rgba(212,175,55,0.32);border-style:dashed;animation:spin 7s linear infinite;}
.scan-ring:nth-child(2){inset:22px;border-color:oklch(0.55 0.22 290/0.48);animation:spin 10s linear infinite reverse;}
.scan-ring:nth-child(3){inset:46px;border-color:rgba(212,175,55,0.22);border-style:dashed;animation:spin 5.5s linear infinite;}
.scan-ring:nth-child(4){inset:70px;border-color:oklch(0.55 0.22 290/0.38);animation:spin 13s linear infinite reverse;}
.scan-core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
@keyframes spin{to{transform:rotate(360deg);}}
.scan-glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(140,80,220,0.13) 0%,transparent 65%);animation:scanGlowPulse 1.6s ease-in-out infinite;}
@keyframes scanGlowPulse{0%,100%{opacity:0.5;transform:scale(0.95);}50%{opacity:1;transform:scale(1.05);}}
.scan-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.5rem,4vw,2.1rem);font-weight:300;color:#fff;margin-bottom:32px;}
.scan-phrase{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);height:20px;overflow:hidden;}
.scan-phrase-text{display:block;animation:phraseIn 0.38s cubic-bezier(0.16,1,0.3,1) forwards;}
@keyframes phraseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.scan-bar-wrap{width:280px;height:2px;background:rgba(255,255,255,0.05);border-radius:2px;margin-top:40px;overflow:hidden;}
.scan-bar{height:100%;background:linear-gradient(90deg,var(--pur-l),var(--gold));box-shadow:0 0 10px var(--gold);transition:width 0.35s ease;}
.scan-flash{position:fixed;inset:0;background:rgba(255,255,255,0);z-index:100;pointer-events:none;transition:background 0.12s;}
.scan-flash.lit{background:rgba(255,255,255,0.09);}

/* ── SALES ── */
.sales-wrap{width:100%;max-width:700px;margin:0 auto;padding:60px 24px 140px;}

/* Countdown */
.countdown-bar{
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(135deg,rgba(180,30,30,0.12),rgba(220,80,50,0.08));
  border:1px solid rgba(220,80,50,0.25);
  border-radius:8px;padding:14px 20px;margin-bottom:36px;
  animation:fadeUp 0.6s ease-out;
}
.cd-label{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,120,80,0.8);}
.cd-time{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:#ff7a5a;font-variant-numeric:tabular-nums;letter-spacing:0.06em;}
.cd-pulse{width:6px;height:6px;border-radius:50%;background:#ff5a3a;animation:cdPulse 1s ease-in-out infinite;flex-shrink:0;}
@keyframes cdPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.6);}}

.s-badge{display:inline-block;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.22);border-radius:20px;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);padding:6px 20px;margin-bottom:22px;}
.s-headline{font-family:'Cormorant Garamond',serif;font-size:clamp(1.75rem,5.5vw,3rem);font-weight:400;line-height:1.12;color:#fff;margin-bottom:16px;text-wrap:pretty;}
.s-headline span{background:linear-gradient(135deg,var(--gold-l),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.s-sub{color:var(--dim);font-size:0.93rem;line-height:1.75;margin-bottom:48px;}

/* Blurred result */
.blur-card{position:relative;background:rgba(255,255,255,0.025);border:1px solid var(--border);border-radius:14px;padding:32px;margin-bottom:44px;overflow:hidden;}
.blur-card::after{content:'';position:absolute;inset:0;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);background:linear-gradient(to bottom,transparent 0%,rgba(5,5,5,0.55) 38%,rgba(5,5,5,0.94) 100%);z-index:1;}
.blur-text{filter:blur(4.5px);user-select:none;color:rgba(255,255,255,0.38);font-size:0.87rem;line-height:1.88;}
.lock-overlay{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.lock-ring{width:46px;height:46px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);animation:lockPulse 2.2s ease-in-out infinite;}
@keyframes lockPulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0.3);}50%{box-shadow:0 0 0 14px rgba(212,175,55,0);}}
.lock-lbl{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);opacity:0.75;}

/* Blocks */
.block-list{display:flex;flex-direction:column;gap:10px;margin-bottom:44px;}
.block-item{display:flex;align-items:flex-start;gap:14px;background:rgba(255,255,255,0.022);border:1px solid rgba(255,255,255,0.055);border-radius:10px;padding:18px 20px;backdrop-filter:blur(10px);transition:border-color 0.3s,background 0.3s;}
.block-item:hover{border-color:rgba(212,175,55,0.15);background:rgba(255,255,255,0.035);}
.block-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--gold);font-weight:500;}
.block-txt{font-size:0.87rem;line-height:1.68;color:rgba(255,255,255,0.62);}
.block-txt strong{color:rgba(255,255,255,0.9);display:block;margin-bottom:4px;font-size:0.9rem;}

/* Testimonials */
.testi-section{margin-bottom:48px;}
.testi-header{text-align:center;margin-bottom:28px;}
.testi-eyebrow{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:8px;}
.testi-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.1rem,3vw,1.5rem);font-weight:400;color:rgba(255,255,255,0.65);font-style:italic;}
.testi-grid{display:flex;flex-direction:column;gap:12px;}
.testi-card{
  background:rgba(255,255,255,0.022);border:1px solid rgba(255,255,255,0.06);
  border-radius:12px;padding:22px 22px 18px;
  backdrop-filter:blur(12px);position:relative;overflow:hidden;
  transition:border-color 0.3s;
}
.testi-card:hover{border-color:rgba(212,175,55,0.18);}
.testi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--tc,rgba(212,175,55,0.3)),transparent);}
.testi-stars{display:flex;gap:3px;margin-bottom:12px;}
.testi-star{color:var(--gold);font-size:11px;}
.testi-quote{font-size:0.87rem;line-height:1.72;color:rgba(255,255,255,0.68);font-style:italic;margin-bottom:14px;}
.testi-author{display:flex;align-items:center;gap:10px;}
.testi-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:rgba(255,255,255,0.8);flex-shrink:0;}
.testi-name{font-size:12px;font-weight:500;color:rgba(255,255,255,0.75);}
.testi-loc{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:0.06em;}

/* Offer */
.offer-card{background:linear-gradient(135deg,rgba(212,175,55,0.045),rgba(80,40,180,0.045));border:1px solid rgba(212,175,55,0.2);border-radius:14px;padding:36px 32px;margin-bottom:12px;position:relative;overflow:hidden;}
.offer-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 40%,var(--gold-l) 60%,transparent);}
.offer-lbl{font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:var(--gold);opacity:0.6;margin-bottom:10px;}
.offer-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.25rem,3.2vw,1.75rem);font-weight:400;color:#fff;margin-bottom:10px;}
.offer-desc{font-size:0.86rem;color:var(--dim);line-height:1.68;margin-bottom:24px;}
.offer-price{display:flex;align-items:baseline;gap:12px;margin-bottom:0;}
.price-from{font-size:0.82rem;color:var(--dim);text-decoration:line-through;}
.price-main{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:500;color:var(--gold);}
.price-note{font-size:0.78rem;color:var(--dim);}

/* Bump */
.bump{
  display:flex;align-items:flex-start;gap:14px;
  border-radius:10px;padding:18px 20px;margin-bottom:12px;
  transition:border-color 0.3s,background 0.3s;
  border:1px dashed rgba(160,100,255,0.2);
  background:rgba(100,50,220,0.045);
  cursor:pointer;
}
.bump-chk{flex-shrink:0;width:20px;height:20px;border-radius:4px;border:1.5px solid var(--pur-l);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;margin-top:2px;}
.bump-chk.on{background:var(--pur-l);border-color:var(--pur-l);}
.bump-t{font-size:0.87rem;font-weight:500;color:rgba(255,255,255,0.85);margin-bottom:5px;}
.bump-d{font-size:0.8rem;color:var(--dim);line-height:1.55;}
.bump-p{font-size:0.88rem;color:var(--pur-l);font-weight:500;margin-top:7px;}

/* Total */
.total-row{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;background:rgba(212,175,55,0.04);border:1px solid rgba(212,175,55,0.12);border-radius:8px;margin-bottom:4px;}
.total-detail{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.28);margin-bottom:3px;}
.total-items{font-size:11px;color:rgba(255,255,255,0.32);}

<!-- ── PARTICLES ── -->
<script>
(function(){
  const cv=document.getElementById('particles-canvas'),cx=cv.getContext('2d');
  let W,H,mouse={x:-999,y:-999};
  const G=[212,175,55],P=[140,80,220];
  const pts=[];
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  resize(); addEventListener('resize',resize);
  addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
  class Pt{
    constructor(){this.reset(true);}
    reset(init){
      this.x=Math.random()*W; this.y=init?Math.random()*H:H+8;
      this.vx=(Math.random()-.5)*.28; this.vy=-(Math.random()*.35+.08);
      this.r=Math.random()*1.4+.3; this.life=0; this.max=Math.random()*320+180;
      this.c=Math.random()>.5?G:P;
    }
    tick(){
      const dx=mouse.x-this.x,dy=mouse.y-this.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<130){this.vx+=dx/d*.014;this.vy+=dy/d*.014;}
      this.vx*=.99;this.vy*=.99;
      this.x+=this.vx;this.y+=this.vy;this.life++;
      if(this.life>this.max||this.y<-20)this.reset(false);
    }
    draw(){
      const a=Math.sin(this.life/this.max*Math.PI)*.5;
      cx.beginPath();cx.arc(this.x,this.y,this.r,0,Math.PI*2);
      cx.fillStyle=`rgba(${this.c[0]},${this.c[1]},${this.c[2]},${a})`;
      cx.fill();
    }
  }
  for(let i=0;i<90;i++)pts.push(new Pt());
  function loop(){
    cx.clearRect(0,0,W,H);
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<88){cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);
        cx.strokeStyle=`rgba(212,175,55,${(1-d/88)*.11})`;cx.lineWidth=.5;cx.stroke();}
    }
    pts.forEach(p=>{p.tick();p.draw();});
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>

<script>

  function step(){gx+=(rx-gx)*.11;gy+=(ry-gy)*.11;g.style.cssText=`position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);left:${gx}px;top:${gy}px;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.55) 0%,rgba(212,175,55,.05) 55%,transparent 70%);mix-blend-mode:screen;transition:width .18s,height .18s;`;requestAnimationFrame(step);}
  step();

})();

<script>
window.SFA_AUDIO=(function(){
  let ctx=null;
  function init(){if(ctx)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  function tone(f,d=.08,t='sine',v=.05){
    try{init();if(!ctx)return;
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type=t;o.frequency.value=f;
      g.gain.setValueAtTime(0,ctx.currentTime);
      g.gain.linearRampToValueAtTime(v,ctx.currentTime+.01);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);
      o.start();o.stop(ctx.currentTime+d+.02);
    }catch(e){}
  }
  return{
    click:()=>tone(660,.06,'sine',.04),
    select:(n)=>{tone(330+n*55,.12,'sine',.05);setTimeout(()=>tone(440+n*55,.08,'sine',.03),80);},
    next:()=>{tone(220,.3,'sine',.04);setTimeout(()=>tone(330,.25,'sine',.03),180);},
    beep:()=>tone(880,.04,'square',.018),
    complete:()=>[440,550,660,880].forEach((f,i)=>setTimeout(()=>tone(f,.15,'sine',.05),i*90)),
    portal:()=>{[220,330,440,550,660,880].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sine',.04),i*80));}
  };
})();
</script>

/* ─── TYPING HOOK ────────────────────────────────── */
function useTyping(text,speed=24){
  const [disp,setDisp]=useState('');
  const [done,setDone]=useState(false);
  useEffect(()=>{
    setDisp('');setDone(false);let i=0;
    const id=setInterval(()=>{i++;setDisp(text.slice(0,i));if(i>=text.length){clearInterval(id);setDone(true);}},speed);
    return()=>clearInterval(id);
  },[text]);
  return{disp,done};
}

/* ─── COUNTDOWN HOOK ─────────────────────────────── */
function useCountdown(minutes=15){
  const KEY='sfa_cd_end';
  const [secs,setSecs]=useState(()=>{
    const end=localStorage.getItem(KEY);
    if(end){const rem=Math.floor((+end-Date.now())/1000);return rem>0?rem:0;}
    const e=Date.now()+minutes*60*1000;
    localStorage.setItem(KEY,e);
    return minutes*60;
  });
  useEffect(()=>{
    if(secs<=0)return;
    const id=setInterval(()=>setSecs(s=>{if(s<=1){clearInterval(id);return 0;}return s-1;}),1000);
    return()=>clearInterval(id);
  },[]);
  const m=String(Math.floor(secs/60)).padStart(2,'0');
  const s=String(secs%60).padStart(2,'0');
  return`${m}:${s}`;
}

          <div className="prog-dot" style={{left:prog+'%'}}/>
        </div>
      </div>
      <div className="q-step">Pergunta {stepNum} de {total}</div>
      <div className="q-text">{disp}{!tDone&&<span className="q-cursor"/>}</div>
      <div className="q-options">
        {data.opts.map((opt,i)=>(
          <button key={i} className={`q-opt${sel===i?' chosen':''}`}
            style={{'--aura':opt.aura,opacity:optsVis?1:0,
              transform:optsVis?(sel===i?'translateX(5px)':'none'):'translateY(16px)',
              transition:`opacity .42s ${i*.07}s, transform .42s ${i*.07}s cubic-bezier(.16,1,.3,1), border-color .28s, background .28s`}}
            onClick={()=>pick(i)}>
            <span className="q-opt-shine"/>
            {opt.label}
            {sel===i&&<span className="q-orb" style={{'--aura':opt.aura}}/>}
          </button>
        ))}
      </div>
      <button className="btn-next" onClick={go} disabled={sel===null}>
        {stepNum<total?'Continuar →':'Revelar Meu Campo →'}
      </button>
    </div>
  );
}

/* ─── DEEP SCAN ──────────────────────────────────── */
function DeepScan({onDone}){
  const [idx,setIdx]=useState(0);
  const [prog,setProg]=useState(0);
  const flashEl=document.getElementById('scan-flash');
  useEffect(()=>{
    let i=0;const tot=SCAN_PHRASES.length;
    const id=setInterval(()=>{
      SFA_AUDIO.beep();
      if(flashEl){flashEl.classList.add('lit');setTimeout(()=>flashEl.classList.remove('lit'),110);}
      i++;setIdx(i);setProg(Math.min((i/tot)*100,100));
      if(i>=tot){
        clearInterval(id);SFA_AUDIO.complete();
        setTimeout(()=>{
          if(flashEl){flashEl.style.transition='background .06s';flashEl.style.background='rgba(255,255,255,.14)';}
          setTimeout(()=>{if(flashEl)flashEl.style.background='rgba(255,255,255,0)';onDone();},220);
        },800);
      }
    },660);
    return()=>clearInterval(id);
  },[]);
  const phrase=SCAN_PHRASES[Math.min(idx,SCAN_PHRASES.length-1)];
  return(
    <div className="scan-wrap fade-in">
      <div className="scan-geo">
        <div className="scan-ring"/><div className="scan-ring"/>
        <div className="scan-ring"/><div className="scan-ring"/>
        <div className="scan-glow"/>
        <div className="scan-core">
          <svg viewBox="0 0 80 80" fill="none" width="80" height="80">
            <circle cx="40" cy="40" r="35" stroke="rgba(212,175,55,0.22)" strokeWidth=".6"/>
            <polygon points="40,6 70,58 10,58" fill="none" stroke="rgba(212,175,55,0.55)" strokeWidth=".8"/>
            <polygon points="40,74 70,22 10,22" fill="none" stroke="rgba(140,80,220,0.5)" strokeWidth=".8"/>
            <circle cx="40" cy="40" r="9" fill="rgba(212,175,55,0.05)" stroke="rgba(212,175,55,0.45)" strokeWidth=".8"/>
            <circle cx="40" cy="40" r="2.5" fill="rgba(212,175,55,1)"/>
          </svg>
        </div>
      </div>
      <h2 className="scan-title">Lendo seu Campo Energético...</h2>
      <div className="scan-phrase" key={idx}><span className="scan-phrase-text">{phrase}</span></div>
      <div className="scan-bar-wrap"><div className="scan-bar" style={{width:prog+'%'}}/></div>
      <div style={{marginTop:10,fontSize:'11px',color:'var(--gold)',letterSpacing:'0.14em',fontVariantNumeric:'tabular-nums'}}>{Math.round(prog)}%</div>
      <div style={{marginTop:36,fontSize:'10px',letterSpacing:'0.16em',textTransform:'uppercase',color:'rgba(255,255,255,0.15)'}}>Processando {SCAN_PHRASES.length} camadas dimensionais</div>
    </div>
  );
}

/* ─── APP ────────────────────────────────────────── */
function App(){
  const [phase,setPhase]=useState(()=>localStorage.getItem('sfa_phase')||'hero');
  const [step,setStep]=useState(()=>parseInt(localStorage.getItem('sfa_step')||'0'));
  const [confirmUrl,setConfirmUrl]=useState(null);
  const [tweaks,setTweaks]=useState(false);

  useEffect(()=>{localStorage.setItem('sfa_phase',phase);},[phase]);
  useEffect(()=>{localStorage.setItem('sfa_step',step);},[step]);

  useEffect(()=>{
    const h=e=>{
      if(e.data?.type==='__activate_edit_mode')setTweaks(true);
      if(e.data?.type==='__deactivate_edit_mode')setTweaks(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',h);
  },[]);

  function nextQ(){
    const n=step+1;
    if(n>=QUESTIONS.length){setPhase('scan');setStep(0);}
    else setStep(n);
  }
  function reset(){
    setPhase('hero');setStep(0);setConfirmUrl(null);
    localStorage.removeItem('sfa_phase');
    localStorage.removeItem('sfa_step');
    localStorage.removeItem('sfa_cd_end');
  }

  if(confirmUrl) return <Confirm url={confirmUrl}/>;

  return(
    <>
      {phase==='hero'&&<Hero onStart={()=>setPhase('quiz')}/>}
      {phase==='quiz'&&<Question key={step} data={QUESTIONS[step]} stepNum={step+1} total={QUESTIONS.length} onNext={nextQ}/>}
      {phase==='scan'&&<DeepScan onDone={()=>setPhase('sales')}/>}
      {phase==='sales'&&<Sales onConfirm={url=>{setConfirmUrl(url);}}/>}

      {/* Tweaks */}
      <div className={`tw-panel${tweaks?' on':''}`}>
        <div className="tw-h">✦ Tweaks</div>
        <div className="tw-row">
          <div className="tw-lbl">Fase</div>
          <select className="tw-sel" value={phase} onChange={e=>{setPhase(e.target.value);setStep(0);}}>
            <option value="hero">Hero</option>
            <option value="quiz">Quiz</option>
            <option value="scan">Deep Scan</option>
            <option value="sales">Vendas</option>
          </select>
        </div>
        {phase==='quiz'&&(
          <div className="tw-row">
            <div className="tw-lbl">Pergunta</div>
            <select className="tw-sel" value={step} onChange={e=>setStep(Number(e.target.value))}>
              {QUESTIONS.map((_,i)=><option key={i} value={i}>P{i+1}</option>)}
            </select>
          </div>
        )}
        <button className="tw-btn" onClick={reset}>↺ Reiniciar tudo</button>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
